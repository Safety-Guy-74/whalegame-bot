name: Whale Game bot

on:
  schedule:
    - cron: "7 * * * *"        # every hour at :07 (UTC)
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - status
          - collect
          - approve
          - release_burn
          - resume

permissions:
  contents: write

concurrency:
  group: whalegame-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_ACTION: ${{ github.event.inputs.action || 'run' }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "whalegame-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "bot state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push || true
